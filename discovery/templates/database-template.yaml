# =============================================================================
# Database Discovery Template
# Schema: discovery/schemas/database.schema.json
# Rules:  discovery/VALIDATION_RULES.md
# =============================================================================

# -----------------------------------------------------------------------------
# REQUIRED — Common metadata
# Schema: discovery/schemas/common-metadata.schema.json
# Do not define alternate or domain-specific metadata structures.
# -----------------------------------------------------------------------------
metadata:
  discovery_id: ""              # DISC-DB-0001 (see VALIDATION_RULES.md ID convention)
  discovery_type: database  # Fixed value for this template
  source_repository: ""         # Repository name under discovery (e.g. eduvijna-api)
  discovered_at: ""             # ISO-8601 timestamp (e.g. 2026-08-07T14:00:00Z)
  discovered_by: ""             # Person or role who captured the inventory
  confidence: ""                # HIGH | MEDIUM | LOW
  version: "0.1.0"              # Inventory record version

# -----------------------------------------------------------------------------
# REQUIRED — Database identity
# -----------------------------------------------------------------------------
database:
  database_id: ""               # Stable ID for the database asset
  name: ""                      # Logical or instance name
  engine: ""                    # e.g. postgresql | mysql | mongodb | sqlserver | other | UNKNOWN
  engine_version: ""            # Evidenced version or UNKNOWN
  purpose: ""                   # Evidenced purpose statement or UNKNOWN
  technical_owner: ""           # Owning team/role or UNKNOWN
  environment: ""               # e.g. prod | nonprod | UNKNOWN

# -----------------------------------------------------------------------------
# OPTIONAL — Database attributes
# -----------------------------------------------------------------------------
database_optional:
  hosting_model: ""             # on-prem | iaas | paas | saas | UNKNOWN
  deployment_location: ""       # Region/account/cluster if evidenced
  high_availability: ""         # true | false | UNKNOWN
  backup_strategy_known: ""     # true | false | UNKNOWN
  data_classification: ""
  related_application_ids: []
  related_repository_ids: []
  schema_migration_tool: ""     # If evidenced
  notes: ""

# -----------------------------------------------------------------------------
# REQUIRED — Evidence (structured)
# Every asserted fact must map to at least one evidence entry.
# Free-form evidence is not permitted.
# -----------------------------------------------------------------------------
evidence:
  - type: ""                    # package-json | pyproject | requirements-txt | dockerfile | docker-compose | csproj | solution | github-workflow | terraform | kubernetes | readme | manual | other
    location: ""                # Path or locator (e.g. package.json)
    description: ""             # What fact(s) this evidence supports

# -----------------------------------------------------------------------------
# REQUIRED — Unknown Value Policy
# -----------------------------------------------------------------------------
unknown_value_policy:
  statement: "Unknown values are recorded explicitly using the marker. Never invent or guess missing facts."
  marker: UNKNOWN
  fields_marked_unknown: []
  rationale_required: true

# -----------------------------------------------------------------------------
# OPTIONAL — Observations (NOT facts)
# -----------------------------------------------------------------------------
observations: []

# -----------------------------------------------------------------------------
# OPTIONAL — Assumptions (explicit; not facts)
# -----------------------------------------------------------------------------
assumptions: []

# -----------------------------------------------------------------------------
# REQUIRED — Reproducibility
# -----------------------------------------------------------------------------
reproducibility:
  method: ""
  tooling: []
  replay_notes: ""
